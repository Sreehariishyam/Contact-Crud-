<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container my-5">
        <h1 class="text-center text-primary">CONTACT MANAGEMENT APP</h1>

        <input type="text" id="editStatus" hidden>

        <form id="contactForm">
            <div class="row my-5">
                <div class="col-lg-4 mb-3">
                    <input id="contactName" type="text" placeholder="Enter Contact Name" class="form-control">
                </div>
                <div class="col-lg-4 mb-3">
                    <input id="contactPhone" type="text" placeholder="Enter Phone Number" class="form-control">
                </div>
                <div class="col-lg-4 mb-3">
                    <input id="contactEmail" type="email" placeholder="Enter Email Address" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Save</button>
        </form>

        <div class="my-4">
            <input type="text" id="searchInput"
                placeholder="Search contacts by name"
                class="form-control">
        </div>
       
        <table class="my-5 table table-bordered table-hover">
            <thead class="table-dark text-light text-center">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Email Address</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="tableBody">

            </tbody>
        </table>
    </div>
</body>
<script src="./main.js"></script>
</html>
